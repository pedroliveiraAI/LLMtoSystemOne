[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jevforge"
version = "0.1.0"
description = "Turn any Hugging Face causal LM into a Jev-style decision model (LLM-as-Jev, arXiv 2610.02076v2)"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "transformers>=4.51", "peft>=0.12", "datasets>=2.19,<4", "accelerate"]

[project.optional-dependencies]
serve = ["fastapi", "uvicorn"]
general = ["lm-eval>=0.4.5"]
dev = ["pytest"]

[project.scripts]
jevforge = "jevforge.cli:main"

[tool.setuptools.packages.find]
include = ["jevforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
